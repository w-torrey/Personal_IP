# auto deploy
name: Deploy to Omen

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/ipuser/IndexPulse
          git pull origin main

      - name: Build frontend
        run: |
          cd /home/ipuser/IndexPulse/frontend
          npm install
          npm run build

      - name: Restart uvicorn
        run: |
          sudo systemctl restart indexpulse
